<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Carbon Multimarcas - Catálogo Automático</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. CABEÇALHO -->
    <header class="topbar">
        <div class="logo">
            <img src="img/logomarca.png" alt="Auto Carbon Multimarcas">
        </div>
        <nav class="nav-links">
            <a href="https://wa.me/5565999494847" class="whatsapp">
                <img src="img/icon/whatsapp.svg" alt="WhatsApp">
                (65) 99949-4847 WhatsApp
            </a>
            <a href="#">Administração (ERP)</a>
        </nav>
    </header>

    <!-- 2. SEÇÃO DE FILTROS -->
    <section class="filter-section">
        <h2>USE NOSSO FILTRO DINÂMICO E ENCONTRE SEU VEÍCULO IDEAL</h2>
        
        <div class="filtros-container">
            <input type="text" id="filtro-nome" placeholder="Buscar por modelo ou versão...">

            <select id="filtro-marca">
                <option value="">Todas as Marcas</option>
            </select>

            <select id="filtro-ano">
                <option value="">Qualquer Ano</option>
            </select>

            <div class="preco-filtros">
                <input type="number" id="filtro-preco-min" placeholder="Preço Mínimo (R$)">
                <input type="number" id="filtro-preco-max" placeholder="Preço Máximo (R$)">
            </div>

            <button id="btn-limpar-filtros">Limpar</button>
        </div>
    </section>

    <!-- 3. VITRINE DE CARROS (Se essa tag sumir, os carros não carregam) -->
    <main class="catalog-container" id="vitrine-carros">
        <p style="text-align:center; width:100%; grid-column: 1 / -1;">Carregando estoque atualizado...</p>
    </main>

    <!-- 4. PAINEL LATERAL DO SIMULADOR (Inicia Oculto) -->
    <div id="overlay-simulador" class="overlay"></div>
    <aside id="sidebar-simulador" class="sidebar">
        <button id="fechar-simulador" class="btn-fechar">✖</button>
        <div class="simulador-section">
            <h3>Simular Financiamento</h3>
            <p id="veiculo-selecionado-nome" class="destaque-veiculo"></p>

            <div class="form-group">
                <label>Valor do Veículo (R$)</label>
                <input type="number" id="valor-veiculo" readonly>
            </div>

            <div class="form-group">
                <label>Valor da Entrada (R$)</label>
                <input type="number" id="valor-entrada" placeholder="Ex: 20000">
            </div>

            <div class="form-group">
                <label>Prazo de Pagamento</label>
                <select id="prazo-meses">
                    <option value="12">12x</option>
                    <option value="24">24x</option>
                    <option value="36">36x</option>
                    <option value="48" selected>48x</option>
                    <option value="60">60x</option>
                </select>
            </div>

            <input type="hidden" id="taxa-juros" value="1.5"> 
            
            <button id="btn-calcular" class="btn-acessar w-100">Calcular Parcela</button>
            
            <div id="resultado-simulacao" class="resultado-box">
                <p>Valor Financiado: <br><strong id="res-financiado"></strong></p>
                <p class="mt-1">Parcelas: <br><strong id="res-parcelas" class="parcela-destaque"></strong></p>
                <button id="btn-whatsapp" class="btn-whatsapp w-100 mt-1">Enviar Proposta pelo WhatsApp</button>
            </div>
        </div>
    </aside>

    <script src="script.js"></script>
</body>
</html>
